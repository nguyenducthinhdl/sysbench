name: test-scenario-1
storage:
  - endpoint: http://localhost:8000
    auth:
      type: basic
      username: admin
      password: admin
    protocol: http
configs:
  min_size: 100
  max_size: 200000
  concurrent: 100
  duration: 60
scenario:
  - name: linear-01 
    from: 0
    to: 1    
    type: linear    
    rps_min_concurrent: 100
    rps_max_concurrent: 100
    error_rate: 0.01
    query_rate: 1 # 10 queries per minutes
  - name: spike-01
    from: 1
    to: 4
    type: spike
    rps_min_concurrent: 100
    rps_max_concurrent: 1000
    error_rate: 0.01
    query_rate: 100 # 100 queries per minutes
  - name: spike-02
    from: 4
    to: 30
    type: spike
    rps_min_concurrent: 1000
    rps_max_concurrent: 2000
    error_rate: 0.1
    query_rate: 100 # 10 queries per minutes
  - name: linear-02
    from: 30
    to: 50
    type: linear
    rps_min_concurrent: 2000
    rps_max_concurrent: 2000
    error_rate: 0.01
    query_rate: 100 # 100 queries per minutes
  - name: spike-03
    from: 50
    to: 60
    type: spike
    rps_min_concurrent: 2000
    rps_max_concurrent: 100
    error_rate: 0.01
    query_rate: 100 # 100 queries per minutes
    
    
