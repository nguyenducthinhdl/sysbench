# One engine at a time. run.sh passes --profile clickhouse, elasticsearch, loki,
# or victorialogs. That profile starts the engine, Prometheus, Grafana, cAdvisor,
# the metrics receiver, and the bench container.
#
# Image pins follow benchmark-plan.md and phase1a: ClickHouse 26.2, Elasticsearch
# 9.x logsdb, Loki 3.5.x, VictoriaLogs current, Prometheus v2.55.1, Grafana 11.3.1.
#
# The bench runs the checked-in scenario file. --storage-name and
# --storage-endpoint aim it at the engine. The scenario still posts client
# metrics to http://localhost:8001; the bench entrypoint forwards that port to
# the dashboard service. Auth in the scenario is basic admin/admin.

name: syscon-bench

services:
  clickhouse:
    profiles: ["clickhouse"]
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:26.2}
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
      CLICKHOUSE_DB: syscon
    ports:
      - "8123:8123"
      - "9363:9363"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./clickhouse/async-insert.xml:/etc/clickhouse-server/users.d/async-insert.xml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  elasticsearch:
    profiles: ["elasticsearch"]
    image: ${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.5.5}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "9200:9200"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  elasticsearch-exporter:
    profiles: ["elasticsearch"]
    image: ${ES_EXPORTER_IMAGE:-quay.io/prometheuscommunity/elasticsearch-exporter:v1.9.0}
    command:
      - --es.uri=http://elasticsearch:9200
      - --es.all
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "9114:9114"

  loki:
    profiles: ["loki"]
    image: ${LOKI_IMAGE:-grafana/loki:3.5.12}
    command:
      - -config.file=/etc/loki/local.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/local.yaml:/etc/loki/local.yaml:ro

  victorialogs:
    profiles: ["victorialogs"]
    image: ${VL_IMAGE:-victoriametrics/victoria-logs:v1.53.0}
    command:
      - -storageDataPath=/vlogs
      - -httpListenAddr=:9428
      - -retentionPeriod=100y
    ports:
      - "9428:9428"
    volumes:
      - vl-data:/vlogs

  cadvisor:
    profiles: ["clickhouse", "elasticsearch", "loki", "victorialogs"]
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.1}
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  dashboard:
    profiles: ["clickhouse", "elasticsearch", "loki", "victorialogs"]
    image: syscon-bench:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/usr/local/bin/syscon-bench"]
    command:
      - dashboard
      - --addr
      - :8001
      - --username
      - admin
      - --password
      - admin
    ports:
      - "${DASHBOARD_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  prometheus:
    profiles: ["clickhouse", "elasticsearch", "loki", "victorialogs"]
    image: ${PROM_IMAGE:-prom/prometheus:v2.55.1}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ${PROM_CONFIG:-./prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    profiles: ["clickhouse", "elasticsearch", "loki", "victorialogs"]
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.3.1}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/syscon-bench.json
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  bench:
    profiles: ["clickhouse", "elasticsearch", "loki", "victorialogs"]
    image: syscon-bench:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    init: true
    environment:
      STORAGE_NAME: ${STORAGE_NAME:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_READY: ${STORAGE_READY:-}
      SCENARIO: ${SCENARIO:-test-scenario-01.yaml}
      DURATION: ${DURATION:-}
      PRELOAD_ROWS: ${PRELOAD_ROWS:-}
      PRELOAD_PATH: ${PRELOAD_PATH:-}
      PRELOAD_BATCH: ${PRELOAD_BATCH:-200}
      DASHBOARD_UPSTREAM: dashboard:8001
    volumes:
      - ../../log-generator/scenarios:/scenarios:ro
      - ${MESSAGES_FILE:-./messages.txt}:/data/messages.txt:ro
      - ${PRELOAD_HOST_FILE:-../../data/preload-1m.jsonl}:/data/preload.jsonl:ro
    depends_on:
      - dashboard
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  ch-data:
  es-data:
  vl-data:
  prometheus-data:
  grafana-data:
