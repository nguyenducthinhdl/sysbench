# Single-process Loki 3.5 for the Phase 1 Docker profile.
# The rig's distributed TSDB layout is a later phase. This file is the image's
# local config with the ingest limits raised for scenario 02 and analytics off.
# /tmp/loki is writable by the image user, so the profile does not mount a volume.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  grpc_server_max_concurrent_streams: 1000

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: false
        max_size_mb: 100

querier:
  # Preload lines are dated 2026-01-01 and stay in the ingester until a chunk
  # flush. The stock 3h window would not count them.
  query_ingesters_within: 8760h

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  reject_old_samples: false
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
  max_line_size: 4MB
  # One stream is service x component x severity. The field pool has 1000
  # services, so the stock cap of a few thousand streams rejects the file.
  max_streams_per_user: 100000
  max_global_streams_per_user: 100000
  max_query_series: 100000
  max_entries_limit_per_query: 5000
  volume_enabled: true
  metric_aggregation_enabled: true

analytics:
  reporting_enabled: false
