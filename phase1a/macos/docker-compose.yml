# Local Phase 1A on a Mac. This is a pipeline smoke test.
#
# It checks that an arm parses, lands exactly 11,175,629 rows, and reports a canary
# latency. It does not drop the page cache and it does not account CPU per cgroup, so
# nothing it writes belongs in the handbook sizing table. That measurement is
# phase1a/linux on the rig.
#
#   phase1a/macos/driver/replay.sh a2m 1 throttled
#
# replay.sh starts ClickHouse itself. This Mac has the docker-compose binary rather than
# the `docker compose` plugin; the script uses whichever is installed.
# Images are overridable: CH_IMAGE, VECTOR_IMAGE, KAFKA_IMAGE.

services:
  clickhouse:
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:26.2}
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Shared DDL. The client runs inside this container, so it cannot see host paths.
      - ../clickhouse:/sql:ro
      - ../collect.sql:/collect.sql:ro
      - ./clickhouse-config/access.xml:/etc/clickhouse-server/users.d/access.xml:ro

  # Not started by `up`. replay.sh launches one container per run, because each arm is a
  # different config and the corpus arrives on stdin.
  vector:
    image: ${VECTOR_IMAGE:-timberio/vector:latest-debian}
    profiles: ["vector"]
    entrypoint: ["/usr/bin/vector"]
    stdin_open: true
    tty: false
    # 9000 inside the container is the canary socket. Host 9000 is ClickHouse's native
    # protocol, so the canary is published on 9001. 9598 is Vector's Prometheus exporter.
    ports:
      - "9001:9000"
      - "9598:9598"
    volumes:
      - ./vector:/etc/vector:ro
      - ./logs:/var/log/vector
      - vector-data:/var/lib/vector
    depends_on:
      - clickhouse

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.1}
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Advertised as the compose DNS name, so ClickHouse and Vector reach it. localhost
      # here would make the broker advertise an address that only works from the host.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

volumes:
  clickhouse-data:
  vector-data:
