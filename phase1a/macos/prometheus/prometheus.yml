global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  # Vector only listens during a replay (compose run as phase1a-vector).
  # 9598 is published on the host. Down between runs is expected.
  - job_name: vector
    static_configs:
      - targets: ["host.docker.internal:9598"]
