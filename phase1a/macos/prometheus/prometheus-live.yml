global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: vector
    static_configs:
      - targets: ["vector-live:9598"]

  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["envoy:9901"]
